openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Current user account, profile, and activation
  - name: verification
    description: Mobile (SMS) verification via Authentica
  - name: platform
    description: Public platform data (feature flags, stats)
  - name: gamification
    description: Levels, badges, achievements, and Hall of Fame
  - name: notifications
    description: In-app notification center
  - name: payments
    description: World Cup Pass checkout and subscription history (Moyasar)
  - name: analytics
    description: Product analytics tracking and metrics
  - name: admin
    description: Platform admin back-office (admin-only)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the current authenticated user
      description: >
        Returns the current user, provisioning a local record from the auth
        provider on first call. Includes profile, verification, and activation
        state so the client can route the user into onboarding, verification,
        or the app.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/profile:
    patch:
      operationId: updateProfile
      tags: [account]
      summary: Update the current user's profile
      description: >
        Update private real name, public display name, unique @username, and
        avatar. Display name and username are validated for platform-wide
        uniqueness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Display name or username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/display-name-availability:
    get:
      operationId: checkDisplayNameAvailability
      tags: [account]
      summary: Check if a public display name is available
      parameters:
        - name: displayName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResult"

  /me/username-availability:
    get:
      operationId: checkUsernameAvailability
      tags: [account]
      summary: Check if a @username handle is available
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResult"

  /me/suggested-display-names:
    get:
      operationId: getSuggestedDisplayNames
      tags: [account]
      summary: Generate suggested available display names
      description: Returns a list of fun, available display name suggestions.
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayNameSuggestions"

  /me/mobile/send-otp:
    post:
      operationId: sendMobileOtp
      tags: [verification]
      summary: Send an SMS OTP to a Saudi mobile number
      description: >
        Sends a one-time verification code to the provided Saudi mobile number
        via Authentica. The number is stored as pending until verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileOtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileOtpResult"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Mobile number already in use by another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/mobile/verify-otp:
    post:
      operationId: verifyMobileOtp
      tags: [verification]
      summary: Verify the SMS OTP code
      description: Verifies the OTP code and marks the user's mobile number as verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileOtpVerify"
      responses:
        "200":
          description: Verified user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /feature-flags:
    get:
      operationId: getFeatureFlags
      tags: [platform]
      summary: List platform feature flags
      description: Public read of feature flags so the client can gate gradual rollouts.
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureFlag"

  /platform-stats:
    get:
      operationId: getPlatformStats
      tags: [platform]
      summary: Public platform statistics
      description: Aggregate counts for the landing page (users, challenges, predictions).
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /upcoming-matches:
    get:
      operationId: getUpcomingMatches
      tags: [platform]
      summary: Public list of upcoming matches
      description: >-
        The next scheduled, not-yet-kicked-off matches of the active tournament,
        ordered by kickoff, for the public landing schedule. scheduleState
        distinguishes "no schedule published yet" (no_schedule) from "no more
        upcoming matches" (finished) when the list is empty.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
          description: Maximum number of upcoming matches to return.
      responses:
        "200":
          description: Upcoming matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingMatches"

  /plans:
    get:
      operationId: getPlans
      tags: [plans]
      summary: List World Cup Pass plans
      description: Public list of plans with participant limits and entitlements.
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /me/subscription:
    get:
      operationId: getMySubscription
      tags: [plans]
      summary: Current user's plan and entitlements
      description: >
        Returns the authenticated user's active plan (defaulting to Free) with
        its participant limit and capability entitlements.
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySubscription"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenge-templates:
    get:
      operationId: getChallengeTemplates
      tags: [challenges]
      summary: List one-click challenge templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeTemplate"

  /challenges:
    post:
      operationId: createChallenge
      tags: [challenges]
      summary: Create a challenge
      description: >
        Create a challenge from a template or from scratch. Requires an
        activated account. The participant limit is derived from the owner's
        plan entitlement. A unique invite code and link are generated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallenge"
      responses:
        "201":
          description: Created challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/mine:
    get:
      operationId: getMyChallenges
      tags: [challenges]
      summary: Challenges the current user owns or has joined
      responses:
        "200":
          description: My challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyChallenges"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/discover:
    get:
      operationId: discoverChallenges
      tags: [challenges]
      summary: Discover public challenges
      description: >
        Public, searchable list of Public-visibility challenges, ordered by
        popularity (participant count). Guests may browse.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Public challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeSummary"

  /challenges/{id}:
    get:
      operationId: getChallenge
      tags: [challenges]
      summary: Get a challenge by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "403":
          description: Not permitted to view this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateChallenge
      tags: [challenges]
      summary: Update challenge settings (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChallenge"
      responses:
        "200":
          description: Updated challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/regenerate-invite:
    post:
      operationId: regenerateInvite
      tags: [challenges]
      summary: Regenerate a challenge's invite code (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/join:
    post:
      operationId: joinChallenge
      tags: [challenges]
      summary: Join a challenge
      description: >
        Join a challenge. Requires an activated account. Enforces the
        participant limit and records referral attribution.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinChallenge"
      responses:
        "200":
          description: Join result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Participant limit reached or already joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/participants:
    get:
      operationId: getChallengeParticipants
      tags: [challenges]
      summary: List a challenge's participants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Participant"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/participants/remove:
    post:
      operationId: removeParticipant
      tags: [challenges]
      summary: Remove a participant (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveParticipant"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invite/{code}:
    get:
      operationId: getInvitePreview
      tags: [challenges]
      summary: Public preview of a challenge by invite code
      description: >
        Public, unauthenticated preview shown before registration: challenge
        name, prizes, participant count, and description.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches:
    get:
      operationId: getMatches
      tags: [matches]
      summary: Match Center fixtures
      description: >
        World Cup 2026 fixtures for the Match Center, ordered by kickoff. Filter
        by scope (live, upcoming, finished). The caller's own prediction (if any)
        is attached to each match.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [all, live, upcoming, finished]
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchSummary"

  /matches/refresh:
    post:
      operationId: refreshMatches
      tags: [matches]
      summary: Sync fixtures from the football provider and score finals
      description: >
        Pulls the latest teams, fixtures, live status and scores from the active
        football provider, then runs the scoring engine over any final matches.
        Requires an activated account.
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Match detail
      description: >
        A single fixture with team detail, the caller's prediction, and lock
        state. For other participants' predictions in a challenge context, use
        the challenge-scoped match detail endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches/{id}/prediction:
    put:
      operationId: submitPrediction
      tags: [matches]
      summary: Submit or edit a prediction
      description: >
        Create or update the caller's score prediction for a match. Allowed only
        before the prediction lock (kickoff - 30 minutes); the server enforces
        the lock and records every edit to the prediction history. Requires an
        activated account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPrediction"
      responses:
        "200":
          description: Saved prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPrediction"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Predictions are locked for this match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches/{id}/prediction-history:
    get:
      operationId: getPredictionHistory
      tags: [matches]
      summary: Edit history of the caller's prediction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prediction history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PredictionHistoryEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{challengeId}/matches:
    get:
      operationId: getChallengeMatches
      tags: [matches]
      summary: Matches in a challenge with the caller's predictions
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchSummary"
        "403":
          description: Not permitted to view this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{challengeId}/matches/{matchId}:
    get:
      operationId: getChallengeMatch
      tags: [matches]
      summary: Challenge-scoped match detail with participant predictions
      description: >
        A fixture within a challenge. Includes the caller's prediction and, once
        predictions are revealed (after kickoff, subject to the challenge's
        prediction visibility), other participants' predictions.
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "403":
          description: Not permitted to view this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/ranking:
    get:
      operationId: getChallengeRanking
      tags: [rankings]
      summary: Challenge leaderboard
      description: >
        Live standings for a challenge: rank, rank movement since the last
        scoring run, points, accuracy and exact/total predictions. The caller's
        own entry is highlighted via isCurrentUser and returned as me.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingResponse"
        "403":
          description: Not permitted to view this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rankings/global:
    get:
      operationId: getGlobalRanking
      tags: [rankings]
      summary: Global leaderboard
      description: >
        Platform-wide standings across all scored predictions. Each prediction
        is counted once. The caller's own entry is highlighted and returned as
        me even if outside the returned page.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Global ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingResponse"

  /challenges/{id}/winning-probability:
    get:
      operationId: getWinningProbability
      tags: [rankings]
      summary: Caller's winning probability in a challenge
      description: >
        Heuristic estimate of the caller's chance to finish 1st, in the top 3
        and in the top 10, from current rank, points gap to the leader,
        accuracy and remaining matches. Gated by the winning_probability flag.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Winning probability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WinningProbability"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{challengeId}/matches/{matchId}/impact:
    get:
      operationId: getRankingImpact
      tags: [rankings]
      summary: Estimated ranking impact of a live/upcoming match
      description: >
        For a match within a challenge, projects where the caller would rank if
        the current (live or predicted) result stands, e.g. moving from #8 to
        #4. Challenge-scoped to the caller.
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ranking impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingImpact"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a participant
          content:
            application/json:
              schema:
