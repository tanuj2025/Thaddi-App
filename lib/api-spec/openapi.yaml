            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{challengeId}/matches/{matchId}:
    get:
      operationId: getChallengeMatch
      tags: [matches]
      summary: Challenge-scoped match detail with participant predictions
      description: >
        A fixture within a challenge. Includes the caller's prediction and, once
        predictions are revealed (after kickoff, subject to the challenge's
        prediction visibility), other participants' predictions.
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "403":
          description: Not permitted to view this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/predictions:
    get:
      operationId: getChallengePredictions
      tags: [challenges]
      summary: Consolidated participant predictions for a challenge
      description: >
        Returns every active participant together with their submitted
        predictions across the challenge's matches, in one consolidated view.
        Visibility is gated by the challenge's prediction-visibility setting:
        always_visible reveals all predictions to everyone at any time;
        reveal_after_kickoff reveals a match's predictions only once it has
        kicked off; hidden reveals only the caller's own. Each match also carries
        a revealed flag indicating whether other participants' predictions for
        that match are visible to the caller.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Consolidated predictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengePredictions"
        "403":
          description: Not permitted to view this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/ranking:
    get:
      operationId: getChallengeRanking
      tags: [rankings]
      summary: Challenge leaderboard
      description: >
        Live standings for a challenge: rank, rank movement since the last
        scoring run, points, accuracy and exact/total predictions. The caller's
        own entry is highlighted via isCurrentUser and returned as me.
