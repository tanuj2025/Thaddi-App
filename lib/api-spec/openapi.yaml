        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

