      summary: Popular outcomes and scorelines for a match
      description: >
        Aggregate counts of predicted outcomes and the most popular exact
        scorelines, each tagged popular/common/bold/rare. Only available once
        the match has kicked off; before kickoff revealed is false with no
        scorelines. Gated by the prediction_comparison flag on the client.
      parameters:
        - name: id
          in: path
          required: true
