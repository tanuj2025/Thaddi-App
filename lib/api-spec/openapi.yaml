          in: path
          required: true
          schema:
            type: string
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ranking impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingImpact"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches/{id}/trends:
    get:
      operationId: getMatchTrends
      tags: [matches]
      summary: Aggregate prediction trends for a match
      description: >
        Percentage split of predicted outcomes (home win / draw / away win)
