openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Current user account, profile, and activation
  - name: verification
    description: Mobile (SMS) verification via Authentica
  - name: platform
    description: Public platform data (feature flags, stats)
  - name: gamification
    description: Levels, badges, achievements, and Hall of Fame
  - name: notifications
    description: In-app notification center
  - name: payments
    description: World Cup Pass checkout and subscription history (Moyasar)
  - name: analytics
    description: Product analytics tracking and metrics
  - name: admin
    description: Platform admin back-office (admin-only)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the current authenticated user
      description: >
        Returns the current user, provisioning a local record from the auth
        provider on first call. Includes profile, verification, and activation
        state so the client can route the user into onboarding, verification,
        or the app.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/profile:
    patch:
      operationId: updateProfile
      tags: [account]
      summary: Update the current user's profile
      description: >
        Update private real name, public display name, unique @username, and
        avatar. Display name and username are validated for platform-wide
        uniqueness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Display name or username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/display-name-availability:
    get:
      operationId: checkDisplayNameAvailability
      tags: [account]
      summary: Check if a public display name is available
      parameters:
        - name: displayName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResult"

  /me/username-availability:
    get:
      operationId: checkUsernameAvailability
      tags: [account]
      summary: Check if a @username handle is available
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResult"

  /me/suggested-display-names:
    get:
      operationId: getSuggestedDisplayNames
      tags: [account]
      summary: Generate suggested available display names
      description: Returns a list of fun, available display name suggestions.
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayNameSuggestions"

  /me/favorite-team:
    patch:
      operationId: updateFavoriteTeam
      tags: [account]
      summary: Set or clear the user's favourite team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: ["string", "null"]
                  description: UUID of the team, or null to clear
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/mobile/send-otp:
    post:
      operationId: sendMobileOtp
      tags: [verification]
      summary: Send an SMS OTP to a Saudi mobile number
      description: >
        Sends a one-time verification code to the provided Saudi mobile number
        via Authentica. The number is stored as pending until verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileOtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileOtpResult"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Mobile number already in use by another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/mobile/verify-otp:
    post:
      operationId: verifyMobileOtp
      tags: [verification]
      summary: Verify the SMS OTP code
      description: Verifies the OTP code and marks the user's mobile number as verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileOtpVerify"
      responses:
        "200":
          description: Verified user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teams:
    get:
      operationId: getTeams
      tags: [platform]
      summary: List all teams
      description: Public list of all national teams, for the favourite-team picker.
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        nameEn:
                          type: string
                        nameAr:
                          type: string
                        code:
                          type: ["string", "null"]
                        flagUrl:
                          type: ["string", "null"]
                      required:
                        - id
                        - nameEn
                        - nameAr
                required:
                  - teams

  /feature-flags:
    get:
      operationId: getFeatureFlags
      tags: [platform]
      summary: List platform feature flags
      description: Public read of feature flags so the client can gate gradual rollouts.
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureFlag"

  /platform-stats:
    get:
      operationId: getPlatformStats
      tags: [platform]
      summary: Public platform statistics
      description: Aggregate counts for the landing page (users, challenges, predictions).
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /upcoming-matches:
    get:
      operationId: getUpcomingMatches
      tags: [platform]
      summary: Public list of upcoming matches
      description: >-
        The next scheduled, not-yet-kicked-off matches of the active tournament,
        ordered by kickoff, for the public landing schedule. scheduleState
        distinguishes "no schedule published yet" (no_schedule) from "no more
        upcoming matches" (finished) when the list is empty.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
          description: Maximum number of upcoming matches to return.
      responses:
        "200":
          description: Upcoming matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingMatches"

  /schedule:
    get:
      operationId: getSchedule
      tags: [platform]
      summary: Public full match schedule
      description: >-
        The complete fixture list of the active tournament (every match,
        regardless of status), ordered by kickoff, for the public schedule page.
        No predictions are exposed. scheduleState distinguishes "no schedule
        published yet" (no_schedule) from a published schedule where matches
        remain upcoming (upcoming) or every match has kicked off / finished
        (finished).
      responses:
        "200":
          description: Full schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSchedule"

  /plans:
    get:
      operationId: getPlans
      tags: [plans]
      summary: List World Cup Pass plans
      description: Public list of plans with participant limits and entitlements.
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /me/subscription:
    get:
      operationId: getMySubscription
      tags: [plans]
      summary: Current user's plan and entitlements
      description: >
        Returns the authenticated user's active plan (defaulting to Free) with
        its participant limit and capability entitlements.
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySubscription"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenge-templates:
    get:
      operationId: getChallengeTemplates
      tags: [challenges]
      summary: List one-click challenge templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeTemplate"

  /challenges:
    post:
      operationId: createChallenge
      tags: [challenges]
      summary: Create a challenge
      description: >
        Create a challenge from a template or from scratch. Requires an
        activated account. Creating a challenge auto-adds the owner as the first
        participant, consuming a seat from the owner's shared participant pool
        (their plan limit across ALL their challenges). Rejected with 403
        (code "owner_pool_full") when that seat would exceed the pool. A unique
        invite code and link are generated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallenge"
      responses:
        "201":
          description: Created challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/mine:
    get:
      operationId: getMyChallenges
      tags: [challenges]
      summary: Challenges the current user owns or has joined
      responses:
        "200":
          description: My challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyChallenges"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/discover:
    get:
      operationId: discoverChallenges
      tags: [challenges]
      summary: Discover public challenges
      description: >
        Public, searchable list of Public-visibility challenges. Default sort is
        badge_prestige (highest badge spend first); use sort=popular for participant
        count ordering. Guests may browse.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          description: >
            Sort order. badge_prestige (default): highest badge spend first.
            popular: most participants first.
          schema:
            type: string
            enum: [badge_prestige, popular]
      responses:
        "200":
          description: Public challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeSummary"

  /challenges/{id}:
    get:
      operationId: getChallenge
      tags: [challenges]
      summary: Get a challenge by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "403":
          description: Not permitted to view this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateChallenge
      tags: [challenges]
      summary: Update challenge settings (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChallenge"
      responses:
        "200":
          description: Updated challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteChallenge
      tags: [challenges]
      summary: Delete a challenge and all of its related data (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/regenerate-invite:
    post:
      operationId: regenerateInvite
      tags: [challenges]
      summary: Regenerate a challenge's invite code (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/join:
    post:
      operationId: joinChallenge
      tags: [challenges]
      summary: Join a challenge
      description: >
        Join a challenge. Requires an activated account. Enforces the challenge
        owner's shared participant pool (their plan limit across ALL their
        challenges) and records referral attribution.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinChallenge"
      responses:
        "200":
          description: Join result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Host's shared participant pool is full (code "owner_pool_full") or
            the challenge is not open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/join-requests:
    post:
      operationId: requestToJoinChallenge
      tags: [challenges]
      summary: Request to join a private challenge
      description: >
        Submits a join request for a private challenge. The owner receives an
        email notification. A declined request may be re-submitted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestJoinBody"
      responses:
        "200":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestJoinResult"
        "400":
          description: Challenge is public or owner is requesting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already a participant or request already pending/approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getChallengeJoinRequests
      tags: [challenges]
      summary: List pending join requests (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pending join requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequestListResponse"
        "403":
          description: Not the challenge owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/join-requests/{requestId}:
    patch:
      operationId: resolveJoinRequest
      tags: [challenges]
      summary: Approve or decline a join request (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveJoinRequestBody"
      responses:
        "200":
          description: Request resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "400":
          description: Invalid action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the challenge owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request not found or already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Plan capacity full (code "owner_pool_full")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/participants:
    get:
      operationId: getChallengeParticipants
      tags: [challenges]
      summary: List a challenge's participants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Participant"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/participants/remove:
    post:
      operationId: removeParticipant
      tags: [challenges]
      summary: Remove a participant (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveParticipant"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/leave:
    post:
      operationId: leaveChallenge
      tags: [challenges]
      summary: Leave a challenge (participant self-removal)
      description: >
        A non-owner participant removes their own participation from a
        challenge, including their challenge-scoped standing. The owner cannot
        leave (they delete the challenge instead), and a non-member is rejected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Left the challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The owner cannot leave their own challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Challenge not found or not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/assistants:
    post:
      operationId: promoteAssistant
      tags: [challenges]
      summary: Promote a participant to assistant (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantTarget"
      responses:
        "200":
          description: Promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Target is not an active participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/assistants/remove:
    post:
      operationId: demoteAssistant
      tags: [challenges]
      summary: Demote an assistant back to participant (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantTarget"
      responses:
        "200":
          description: Demoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/messages:
    get:
      operationId: getChallengeMessages
      tags: [challenges]
      summary: List a challenge's chat messages (oldest within page first)
      description: >
        Returns the most recent messages for a challenge (membership/visibility
        gated for reading). Pass `before` (a message id) to load older messages.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: before
          in: query
          required: false
          description: Return messages created before this message id (pagination).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeMessagesResponse"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: postChallengeMessage
      tags: [challenges]
      summary: Post a chat message (members only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChallengeMessage"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeMessage"
        "400":
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/messages/{messageId}/delete:
    post:
      operationId: deleteChallengeMessage
      tags: [challenges]
      summary: Soft-delete a chat message (author or challenge owner)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invite/{code}:
    get:
      operationId: getInvitePreview
