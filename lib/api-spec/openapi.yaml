      operationId: adminListSubscriptions
      tags: [admin]
      summary: List subscriptions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubscriptionList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/subscriptions/{id}:
    patch:
      operationId: adminUpdateSubscription
      tags: [admin]
      summary: Update a subscription's status (cancel/expire)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSubscriptionUpdate"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubscription"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/audit-logs:
    get:
      operationId: adminListAuditLogs
      tags: [admin]
      summary: List recent admin audit log entries
      parameters:
        - name: actorUserId
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: entityType
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Only include entries created at or after this timestamp.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only include entries created at or before this timestamp.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    CurrentUser:
      type: object
      description: The current authenticated user with profile and activation state.
      properties:
        id:
          type: string
          description: Internal user id (uuid)
        email:
          type: ["string", "null"]
        emailVerified:
          type: boolean
        realName:
          type: ["string", "null"]
          description: Private real name, never shown publicly
        displayName:
          type: ["string", "null"]
          description: Unique public display name
        username:
          type: ["string", "null"]
          description: Unique @username handle
        avatarUrl:
          type: ["string", "null"]
        mobileNumber:
          type: ["string", "null"]
        mobileVerified:
          type: boolean
        role:
          type: string
          description: user or admin
        level:
          type: string
          description: Gamification level (bronze, silver, gold, elite, legend)
        totalPoints:
          type: integer
        profileComplete:
          type: boolean
          description: True when display name and username are set
        activated:
          type: boolean
          description: True when email + mobile verified and profile complete
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - emailVerified
        - mobileVerified
        - role
        - level
        - totalPoints
        - profileComplete
        - activated
        - createdAt

    ProfileUpdate:
      type: object
      description: Editable profile fields. Omit a field to leave it unchanged.
      properties:
        realName:
          type: string
          minLength: 1
          maxLength: 120
        displayName:
          type: string
          minLength: 2
          maxLength: 40
        username:
          type: string
          minLength: 3
          maxLength: 30
        avatarUrl:
          type: string
        termsAccepted:
          type: boolean
          description: >
            Set to true when the user has accepted the Terms of Service and
            Privacy Policy. The server records the acceptance timestamp and the
            version of the legal text in force at that time.

    AvailabilityResult:
      type: object
      properties:
        value:
          type: string
        available:
          type: boolean
        reason:
          type: ["string", "null"]
          description: Why it is unavailable (taken, invalid, reserved)
      required:
        - value
        - available

    DisplayNameSuggestions:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string
      required:
        - suggestions

    MobileOtpRequest:
      type: object
      properties:
        phoneNumber:
          type: string
          description: Saudi mobile number in E.164 (+9665XXXXXXXX) or local (05XXXXXXXX) format
      required:
        - phoneNumber

    MobileOtpResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        expiresInSeconds:
          type: ["integer", "null"]
      required:
        - success
        - message

    MobileOtpVerify:
      type: object
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 8
      required:
        - code

    FeatureFlag:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        enabled:
          type: boolean
      required:
        - key
        - name
        - enabled

    PlatformStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalChallenges:
          type: integer
        totalPredictions:
          type: integer
        activeChallenges:
          type: integer
        firstMatchKickoff:
          type: string
          format: date-time
          nullable: true
          description: Earliest match kickoff of the active tournament, or null when no schedule is published yet. Used to tell "no schedule yet" apart from "tournament under way / over".
        nextMatchKickoff:
          type: string
          format: date-time
          nullable: true
          description: Kickoff of the earliest still-upcoming (scheduled, not-yet-kicked-off) match of the active tournament, or null when no match is upcoming. Drives the live World Cup countdown.
      required:
        - totalUsers
        - totalChallenges
        - totalPredictions
        - activeChallenges
        - firstMatchKickoff
        - nextMatchKickoff

    UpcomingMatch:
      type: object
      properties:
        id:
          type: string
        stageType:
          type: ["string", "null"]
        venue:
          type: ["string", "null"]
        kickoffAt:
          type: string
          format: date-time
        homeTeam:
          oneOf:
            - $ref: "#/components/schemas/TeamRef"
            - type: "null"
        awayTeam:
          oneOf:
            - $ref: "#/components/schemas/TeamRef"
            - type: "null"
      required:
        - id
        - kickoffAt

    UpcomingMatches:
      type: object
      properties:
        scheduleState:
          type: string
          enum: [no_schedule, upcoming, finished]
          description: >-
            no_schedule = no fixtures published for the active tournament yet;
            upcoming = at least one match is still to kick off; finished = a
            schedule exists but no matches remain upcoming.
        matches:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingMatch"
      required:
        - scheduleState
        - matches

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    Entitlement:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      required:
        - key
        - value

    Plan:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
          enum: [free, professional, legend, business]
        nameEn:
          type: string
        nameAr:
          type: string
        priceSar:
          type: string
        participantLimit:
          type: ["integer", "null"]
        isActive:
          type: boolean
        isComingSoon:
          type: boolean
        orderIndex:
          type: integer
        entitlements:
          type: array
          items:
            $ref: "#/components/schemas/Entitlement"
      required:
        - id
        - code
        - nameEn
        - nameAr
        - priceSar
        - participantLimit
        - isActive
        - isComingSoon
        - orderIndex
        - entitlements

    MySubscription:
      type: object
      properties:
        planCode:
          type: string
          enum: [free, professional, legend, business]
        planNameEn:
          type: string
        planNameAr:
          type: string
        participantLimit:
          type: ["integer", "null"]
        status:
          type: string
        edition:
          type: ["string", "null"]
        entitlements:
          type: array
          items:
            $ref: "#/components/schemas/Entitlement"
      required:
        - planCode
        - planNameEn
        - planNameAr
        - participantLimit
        - status
        - entitlements

    ChallengeTemplate:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        descriptionEn:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]
        scope:
          type: string
          enum: [entire_tournament, stage, team_journey, custom]
        orderIndex:
          type: integer
      required:
        - id
        - slug
        - nameEn
        - nameAr
        - scope
        - orderIndex

    ChallengePrize:
      type: object
      properties:
        place:
          type: integer
        titleEn:
          type: ["string", "null"]
        titleAr:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        value:
          type: ["string", "null"]
        currency:
          type: ["string", "null"]
      required:
        - place

    ChallengePrizeInput:
      type: object
      properties:
        place:
          type: integer
          minimum: 1
        titleEn:
          type: string
        titleAr:
          type: string
        description:
          type: string
        value:
          type: string
        currency:
          type: string
      required:
        - place

    ChallengeOwner:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
      required:
        - id

    ChallengeSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
          enum: [family, friends, company, fan, world_cup, custom]
        visibility:
          type: string
          enum: [private, unlisted, public]
        scope:
          type: string
          enum: [entire_tournament, stage, team_journey, custom]
        status:
          type: string
          enum: [draft, active, completed, cancelled]
        inviteCode:
          type: ["string", "null"]
        participantCount:
          type: integer
        participantLimit:
          type: ["integer", "null"]
        prizeCount:
          type: integer
        ownerDisplayName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - visibility
        - scope
        - status
        - participantCount
        - prizeCount
        - createdAt

    Challenge:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
          enum: [family, friends, company, fan, world_cup, custom]
        visibility:
          type: string
          enum: [private, unlisted, public]
        scope:
          type: string
          enum: [entire_tournament, stage, team_journey, custom]
        status:
          type: string
          enum: [draft, active, completed, cancelled]
        endCondition:
