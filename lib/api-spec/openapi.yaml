components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: >
            Optional machine-readable error code for client-side branching
            (e.g. "owner_pool_full" when the host's shared participant pool
            is exhausted).
      required:
        - error

    CurrentUser:
      type: object
      description: The current authenticated user with profile and activation state.
      properties:
        id:
          type: string
          description: Internal user id (uuid)
        email:
          type: ["string", "null"]
        emailVerified:
          type: boolean
        realName:
          type: ["string", "null"]
          description: Private real name, never shown publicly
        displayName:
          type: ["string", "null"]
          description: Unique public display name
        username:
          type: ["string", "null"]
          description: Unique @username handle
        avatarUrl:
          type: ["string", "null"]
        mobileNumber:
          type: ["string", "null"]
        mobileVerified:
          type: boolean
        role:
          type: string
          description: user or admin
        level:
          type: string
          description: Gamification level (bronze, silver, gold, elite, legend)
        totalPoints:
          type: integer
        profileComplete:
          type: boolean
          description: True when display name and username are set
        favoriteTeamSelected:
          type: boolean
          description: True when the user has chosen a favourite team
        favoriteTeam:
          oneOf:
            - $ref: "#/components/schemas/FavoriteTeamRef"
            - type: "null"
        activated:
          type: boolean
          description: True when email + mobile verified and profile complete
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - emailVerified
        - mobileVerified
        - role
        - level
        - totalPoints
        - profileComplete
        - favoriteTeamSelected
        - activated
        - createdAt

    FavoriteTeamRef:
      type: object
      description: Compact team reference for favourite team display.
      properties:
        id:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        flagUrl:
          type: ["string", "null"]
      required:
        - id
        - nameEn
        - nameAr

    ProfileUpdate:
      type: object
      description: Editable profile fields. Omit a field to leave it unchanged.
      properties:
        realName:
          type: string
          minLength: 1
          maxLength: 120
        displayName:
          type: string
          minLength: 2
          maxLength: 40
        username:
          type: string
          minLength: 3
          maxLength: 30
        avatarUrl:
          type: string
        termsAccepted:
          type: boolean
          description: >
            Set to true when the user has accepted the Terms of Service and
            Privacy Policy. The server records the acceptance timestamp and the
            version of the legal text in force at that time.

    AvailabilityResult:
      type: object
      properties:
        value:
          type: string
        available:
          type: boolean
        reason:
          type: ["string", "null"]
          description: Why it is unavailable (taken, invalid, reserved)
      required:
        - value
        - available

    DisplayNameSuggestions:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string
      required:
        - suggestions

    MobileOtpRequest:
      type: object
      properties:
        phoneNumber:
          type: string
          description: Saudi mobile number in E.164 (+9665XXXXXXXX) or local (05XXXXXXXX) format
      required:
        - phoneNumber

    MobileOtpResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        expiresInSeconds:
          type: ["integer", "null"]
      required:
        - success
        - message

    MobileOtpVerify:
      type: object
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 8
      required:
        - code

    FeatureFlag:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        enabled:
          type: boolean
      required:
        - key
        - name
        - enabled

    PlatformStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalChallenges:
          type: integer
        totalPredictions:
          type: integer
        activeChallenges:
          type: integer
        firstMatchKickoff:
          type: string
          format: date-time
          nullable: true
          description: Earliest match kickoff of the active tournament, or null when no schedule is published yet. Used to tell "no schedule yet" apart from "tournament under way / over".
        nextMatchKickoff:
          type: string
          format: date-time
          nullable: true
          description: Kickoff of the earliest still-upcoming (scheduled, not-yet-kicked-off) match of the active tournament, or null when no match is upcoming. Drives the live World Cup countdown.
      required:
        - totalUsers
        - totalChallenges
        - totalPredictions
        - activeChallenges
        - firstMatchKickoff
        - nextMatchKickoff

    UpcomingMatch:
      type: object
      properties:
        id:
          type: string
        stageType:
          type: ["string", "null"]
        venue:
          type: ["string", "null"]
        kickoffAt:
          type: string
          format: date-time
        homeTeam:
          oneOf:
            - $ref: "#/components/schemas/TeamRef"
            - type: "null"
        awayTeam:
          oneOf:
            - $ref: "#/components/schemas/TeamRef"
            - type: "null"
      required:
        - id
        - kickoffAt

    UpcomingMatches:
      type: object
      properties:
        scheduleState:
          type: string
          enum: [no_schedule, upcoming, finished]
          description: >-
            no_schedule = no fixtures published for the active tournament yet;
            upcoming = at least one match is still to kick off; finished = a
            schedule exists but no matches remain upcoming.
        matches:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingMatch"
      required:
        - scheduleState
        - matches

    PublicMatch:
      type: object
      properties:
        id:
          type: string
        stageType:
          type: ["string", "null"]
        venue:
          type: ["string", "null"]
        kickoffAt:
          type: string
          format: date-time
        status:
          type: string
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
        minute:
          type: ["integer", "null"]
        hasKickedOff:
          type: boolean
        homeTeam:
          oneOf:
            - $ref: "#/components/schemas/TeamRef"
            - type: "null"
        awayTeam:
          oneOf:
            - $ref: "#/components/schemas/TeamRef"
            - type: "null"
      required:
        - id
        - kickoffAt
        - status
        - hasKickedOff

    PublicSchedule:
      type: object
      properties:
        scheduleState:
          type: string
          enum: [no_schedule, upcoming, finished]
          description: >-
            no_schedule = no fixtures published for the active tournament yet;
            upcoming = at least one match is still to kick off; finished = a
            schedule exists but every match has already kicked off or finished.
        matches:
          type: array
          items:
            $ref: "#/components/schemas/PublicMatch"
      required:
        - scheduleState
        - matches

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    Entitlement:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      required:
        - key
        - value

    DisplayFeature:
      type: object
      description: A display-only marketing bullet (bilingual). Not enforced.
      properties:
        en:
          type: string
        ar:
          type: string
      required:
        - en
        - ar

    Plan:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        priceSar:
          type: string
        participantLimit:
          type: ["integer", "null"]
        isActive:
          type: boolean
        isComingSoon:
          type: boolean
        orderIndex:
          type: integer
        entitlements:
          type: array
          items:
            $ref: "#/components/schemas/Entitlement"
        displayFeatures:
          type: array
          items:
            $ref: "#/components/schemas/DisplayFeature"
      required:
        - id
        - code
        - nameEn
        - nameAr
        - priceSar
        - participantLimit
        - isActive
        - isComingSoon
        - orderIndex
        - entitlements
        - displayFeatures

    MySubscription:
      type: object
      properties:
        planCode:
          type: string
        planNameEn:
          type: string
        planNameAr:
          type: string
        participantLimit:
          type: ["integer", "null"]
        participantsUsed:
          type: integer
          description: >
            Active participants across ALL challenges this user owns. The plan's
            participantLimit is a single shared pool; remaining capacity is
            participantLimit - participantsUsed.
        status:
          type: string
        edition:
          type: ["string", "null"]
        entitlements:
          type: array
          items:
            $ref: "#/components/schemas/Entitlement"
        displayFeatures:
          type: array
          items:
            $ref: "#/components/schemas/DisplayFeature"
      required:
        - planCode
        - planNameEn
        - planNameAr
        - participantLimit
        - participantsUsed
        - status
        - entitlements
        - displayFeatures

    ChallengeBadge:
      type: object
      description: A purchasable decorative badge in the catalog (public view).
      properties:
        id:
          type: string
        code:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        iconUrl:
          type: string
        priceSar:
          type: string
        orderIndex:
          type: integer
      required:
        - id
        - code
        - nameEn
        - nameAr
        - iconUrl
        - priceSar
        - orderIndex

    ChallengeBadgeList:
      type: object
      properties:
        badges:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeBadge"
      required:
        - badges

    PurchasedBadge:
      type: object
      description: A badge attached to a challenge (shared per-challenge set).
      properties:
        id:
          type: string
        badgeId:
          type: string
        code:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        iconUrl:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - badgeId
        - code
        - nameEn
        - nameAr
        - iconUrl
        - createdAt

    PurchasedBadgeList:
      type: object
      properties:
        badges:
          type: array
          items:
            $ref: "#/components/schemas/PurchasedBadge"
      required:
        - badges

    ChallengeBadgeCheckoutRequest:
      type: object
      properties:
        badgeId:
          type: string
          description: Catalog id of the badge to buy.
        callbackUrl:
          type: string
          description: Absolute URL Moyasar redirects back to after payment
      required:
        - badgeId
        - callbackUrl

    AdminChallengeBadge:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        iconUrl:
          type: string
        priceSar:
          type: string
        isActive:
          type: boolean
        orderIndex:
          type: integer
      required:
        - id
        - code
        - nameEn
        - nameAr
        - iconUrl
        - priceSar
        - isActive
        - orderIndex

    AdminChallengeBadgeList:
      type: object
      properties:
        badges:
          type: array
          items:
            $ref: "#/components/schemas/AdminChallengeBadge"
      required:
        - badges

    AdminChallengeBadgeCreate:
      type: object
      properties:
        code:
          type: string
          description: Stable lowercase identifier (a-z, 0-9, underscore).
        nameEn:
          type: string
        nameAr:
          type: string
        iconUrl:
          type: string
        priceSar:
          type: string
        isActive:
          type: boolean
        orderIndex:
          type: integer
      required:
        - code
        - nameEn
        - nameAr
        - iconUrl
        - priceSar

    AdminChallengeBadgeUpdate:
      type: object
      properties:
        nameEn:
          type: string
        nameAr:
          type: string
        iconUrl:
          type: string
        priceSar:
          type: string
        isActive:
          type: boolean
        orderIndex:
          type: integer

    ChallengeTemplate:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        descriptionEn:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]
        scope:
          type: string
          enum: [entire_tournament, stage, team_journey, custom]
        orderIndex:
          type: integer
      required:
        - id
        - slug
        - nameEn
        - nameAr
        - scope
        - orderIndex

    ChallengePrize:
      type: object
      properties:
        place:
          type: integer
        titleEn:
          type: ["string", "null"]
        titleAr:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        value:
          type: ["string", "null"]
        currency:
          type: ["string", "null"]
      required:
        - place

    ChallengePrizeInput:
      type: object
      properties:
        place:
          type: integer
          minimum: 1
        titleEn:
          type: string
        titleAr:
          type: string
        description:
          type: string
        value:
          type: string
        currency:
          type: string
      required:
        - place

    ChallengeOwner:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
      required:
        - id

    ChallengeSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
          enum: [family, friends, company, fan, world_cup, custom]
        visibility:
          type: string
          enum: [private, unlisted, public]
        scope:
          type: string
          enum: [entire_tournament, stage, team_journey, custom]
        status:
          type: string
          enum: [draft, active, completed, cancelled]
        inviteCode:
          type: ["string", "null"]
        participantCount:
          type: integer
        participantLimit:
          type: ["integer", "null"]
        prizeCount:
          type: integer
        ownerDisplayName:
          type: ["string", "null"]
        badges:
          type: array
          items:
            $ref: "#/components/schemas/PurchasedBadge"
        badgeCount:
          type: integer
          description: Number of badges purchased for this challenge
