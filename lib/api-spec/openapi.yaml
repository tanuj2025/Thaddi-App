              schema:
                $ref: "#/components/schemas/RankingResponse"
        "403":
          description: Not permitted to view this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rankings/global:
    get:
      operationId: getGlobalRanking
      tags: [rankings]
      summary: Global leaderboard
      description: >
        Platform-wide standings across all scored predictions. Each prediction
        is counted once. The caller's own entry is highlighted and returned as
        me even if outside the returned page.
      parameters:
        - name: limit
          in: query
          required: false
