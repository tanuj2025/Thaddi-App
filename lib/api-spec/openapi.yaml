        templateId:
          type: ["string", "null"]
        tournamentId:
          type: ["string", "null"]
        stageId:
          type: ["string", "null"]
        teamId:
          type: ["string", "null"]
        inviteCode:
          type: ["string", "null"]
        inviteLink:
          type: ["string", "null"]
        participantLimit:
          type: ["integer", "null"]
        participantCount:
          type: integer
        owner:
          $ref: "#/components/schemas/ChallengeOwner"
        isOwner:
          type: boolean
        isParticipant:
          type: boolean
        prizes:
          type: array
          items:
            $ref: "#/components/schemas/ChallengePrize"
