openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Current user account, profile, and activation
  - name: verification
    description: Mobile (SMS) verification via Authentica
  - name: platform
    description: Public platform data (feature flags, stats)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the current authenticated user
      description: >
        Returns the current user, provisioning a local record from the auth
        provider on first call. Includes profile, verification, and activation
        state so the client can route the user into onboarding, verification,
        or the app.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/profile:
    patch:
      operationId: updateProfile
      tags: [account]
      summary: Update the current user's profile
      description: >
        Update private real name, public display name, unique @username, and
        avatar. Display name and username are validated for platform-wide
        uniqueness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Display name or username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/display-name-availability:
    get:
      operationId: checkDisplayNameAvailability
      tags: [account]
      summary: Check if a public display name is available
      parameters:
        - name: displayName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResult"

  /me/username-availability:
    get:
      operationId: checkUsernameAvailability
      tags: [account]
      summary: Check if a @username handle is available
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResult"

  /me/suggested-display-names:
    get:
      operationId: getSuggestedDisplayNames
      tags: [account]
      summary: Generate suggested available display names
      description: Returns a list of fun, available display name suggestions.
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayNameSuggestions"

  /me/mobile/send-otp:
    post:
      operationId: sendMobileOtp
      tags: [verification]
      summary: Send an SMS OTP to a Saudi mobile number
      description: >
        Sends a one-time verification code to the provided Saudi mobile number
        via Authentica. The number is stored as pending until verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileOtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileOtpResult"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Mobile number already in use by another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/mobile/verify-otp:
    post:
      operationId: verifyMobileOtp
      tags: [verification]
      summary: Verify the SMS OTP code
      description: Verifies the OTP code and marks the user's mobile number as verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileOtpVerify"
      responses:
        "200":
          description: Verified user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /feature-flags:
    get:
      operationId: getFeatureFlags
      tags: [platform]
      summary: List platform feature flags
      description: Public read of feature flags so the client can gate gradual rollouts.
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureFlag"

  /platform-stats:
    get:
      operationId: getPlatformStats
      tags: [platform]
      summary: Public platform statistics
      description: Aggregate counts for the landing page (users, challenges, predictions).
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /plans:
    get:
      operationId: getPlans
      tags: [plans]
      summary: List World Cup Pass plans
      description: Public list of plans with participant limits and entitlements.
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /me/subscription:
    get:
      operationId: getMySubscription
      tags: [plans]
      summary: Current user's plan and entitlements
      description: >
        Returns the authenticated user's active plan (defaulting to Free) with
        its participant limit and capability entitlements.
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySubscription"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenge-templates:
    get:
      operationId: getChallengeTemplates
      tags: [challenges]
      summary: List one-click challenge templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeTemplate"

  /challenges:
    post:
      operationId: createChallenge
      tags: [challenges]
      summary: Create a challenge
      description: >
        Create a challenge from a template or from scratch. Requires an
        activated account. The participant limit is derived from the owner's
        plan entitlement. A unique invite code and link are generated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallenge"
      responses:
        "201":
          description: Created challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/mine:
    get:
      operationId: getMyChallenges
      tags: [challenges]
      summary: Challenges the current user owns or has joined
      responses:
        "200":
          description: My challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyChallenges"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/discover:
    get:
      operationId: discoverChallenges
      tags: [challenges]
      summary: Discover public challenges
      description: >
        Public, searchable list of Public-visibility challenges, ordered by
        popularity (participant count). Guests may browse.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Public challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeSummary"

  /challenges/{id}:
    get:
      operationId: getChallenge
      tags: [challenges]
      summary: Get a challenge by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "403":
          description: Not permitted to view this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateChallenge
      tags: [challenges]
      summary: Update challenge settings (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChallenge"
      responses:
        "200":
          description: Updated challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/regenerate-invite:
    post:
      operationId: regenerateInvite
      tags: [challenges]
      summary: Regenerate a challenge's invite code (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/join:
    post:
      operationId: joinChallenge
      tags: [challenges]
      summary: Join a challenge
      description: >
        Join a challenge. Requires an activated account. Enforces the
        participant limit and records referral attribution.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinChallenge"
      responses:
        "200":
          description: Join result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Participant limit reached or already joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/participants:
    get:
      operationId: getChallengeParticipants
      tags: [challenges]
      summary: List a challenge's participants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Participant"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/participants/remove:
    post:
      operationId: removeParticipant
      tags: [challenges]
      summary: Remove a participant (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveParticipant"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invite/{code}:
    get:
      operationId: getInvitePreview
      tags: [challenges]
      summary: Public preview of a challenge by invite code
      description: >
        Public, unauthenticated preview shown before registration: challenge
        name, prizes, participant count, and description.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches:
    get:
      operationId: getMatches
      tags: [matches]
      summary: Match Center fixtures
      description: >
        World Cup 2026 fixtures for the Match Center, ordered by kickoff. Filter
        by scope (live, upcoming, finished). The caller's own prediction (if any)
        is attached to each match.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [all, live, upcoming, finished]
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchSummary"

  /matches/refresh:
    post:
      operationId: refreshMatches
      tags: [matches]
      summary: Sync fixtures from the football provider and score finals
      description: >
        Pulls the latest teams, fixtures, live status and scores from the active
        football provider, then runs the scoring engine over any final matches.
        Requires an activated account.
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Match detail
      description: >
        A single fixture with team detail, the caller's prediction, and lock
        state. For other participants' predictions in a challenge context, use
        the challenge-scoped match detail endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches/{id}/prediction:
    put:
      operationId: submitPrediction
      tags: [matches]
      summary: Submit or edit a prediction
      description: >
        Create or update the caller's score prediction for a match. Allowed only
        before the prediction lock (kickoff - 30 minutes); the server enforces
        the lock and records every edit to the prediction history. Requires an
        activated account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPrediction"
      responses:
        "200":
          description: Saved prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPrediction"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Predictions are locked for this match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches/{id}/prediction-history:
    get:
      operationId: getPredictionHistory
      tags: [matches]
      summary: Edit history of the caller's prediction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prediction history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PredictionHistoryEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{challengeId}/matches:
    get:
      operationId: getChallengeMatches
      tags: [matches]
      summary: Matches in a challenge with the caller's predictions
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchSummary"
        "403":
          description: Not permitted to view this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{challengeId}/matches/{matchId}:
    get:
      operationId: getChallengeMatch
      tags: [matches]
      summary: Challenge-scoped match detail with participant predictions
      description: >
        A fixture within a challenge. Includes the caller's prediction and, once
        predictions are revealed (after kickoff, subject to the challenge's
        prediction visibility), other participants' predictions.
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "403":
          description: Not permitted to view this challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    CurrentUser:
      type: object
      description: The current authenticated user with profile and activation state.
      properties:
        id:
          type: string
          description: Internal user id (uuid)
        email:
          type: ["string", "null"]
        emailVerified:
          type: boolean
        realName:
          type: ["string", "null"]
          description: Private real name, never shown publicly
        displayName:
          type: ["string", "null"]
          description: Unique public display name
        username:
          type: ["string", "null"]
          description: Unique @username handle
        avatarUrl:
          type: ["string", "null"]
        mobileNumber:
          type: ["string", "null"]
        mobileVerified:
          type: boolean
        role:
          type: string
          description: user or admin
        level:
          type: string
          description: Gamification level (bronze, silver, gold, elite, legend)
        totalPoints:
          type: integer
        profileComplete:
          type: boolean
          description: True when display name and username are set
        activated:
          type: boolean
          description: True when email + mobile verified and profile complete
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - emailVerified
        - mobileVerified
        - role
        - level
        - totalPoints
        - profileComplete
        - activated
        - createdAt

    ProfileUpdate:
      type: object
      description: Editable profile fields. Omit a field to leave it unchanged.
      properties:
        realName:
          type: string
          minLength: 1
          maxLength: 120
        displayName:
          type: string
          minLength: 2
          maxLength: 40
        username:
          type: string
          minLength: 3
          maxLength: 30
        avatarUrl:
          type: string

    AvailabilityResult:
      type: object
      properties:
        value:
          type: string
        available:
          type: boolean
        reason:
          type: ["string", "null"]
          description: Why it is unavailable (taken, invalid, reserved)
      required:
        - value
        - available

    DisplayNameSuggestions:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string
      required:
        - suggestions

    MobileOtpRequest:
      type: object
      properties:
        phoneNumber:
          type: string
          description: Saudi mobile number in E.164 (+9665XXXXXXXX) or local (05XXXXXXXX) format
      required:
        - phoneNumber

    MobileOtpResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        expiresInSeconds:
          type: ["integer", "null"]
      required:
        - success
        - message

    MobileOtpVerify:
      type: object
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 8
      required:
        - code

    FeatureFlag:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        enabled:
          type: boolean
      required:
        - key
        - name
        - enabled

    PlatformStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalChallenges:
          type: integer
        totalPredictions:
          type: integer
        activeChallenges:
          type: integer
      required:
        - totalUsers
        - totalChallenges
        - totalPredictions
        - activeChallenges

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    Entitlement:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      required:
        - key
        - value

    Plan:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
          enum: [free, professional, legend, business]
        nameEn:
          type: string
        nameAr:
          type: string
        priceSar:
          type: string
        participantLimit:
          type: ["integer", "null"]
        isActive:
          type: boolean
        isComingSoon:
          type: boolean
        orderIndex:
          type: integer
        entitlements:
          type: array
          items:
            $ref: "#/components/schemas/Entitlement"
      required:
        - id
        - code
        - nameEn
        - nameAr
        - priceSar
        - participantLimit
        - isActive
        - isComingSoon
        - orderIndex
