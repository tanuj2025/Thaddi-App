kind = "slides"
previewPath = "/user-guide/"
title = "thaddi App User Guide"
version = "1.0.0"
id = "artifacts/user-guide"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/user-guide/" ]
localPort = 18666

[services.development]
run = "pnpm --filter @workspace/user-guide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/user-guide", "run", "build" ]
publicDir = "artifacts/user-guide/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18666"
BASE_PATH = "/user-guide/"
