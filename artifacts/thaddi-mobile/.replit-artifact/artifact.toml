kind = "mobile"
previewPath = "/mobile/"
title = "thaddi Mobile"
version = "1.0.0"
id = "artifacts/thaddi-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20717

[services.development]
run = "pnpm --filter @workspace/thaddi-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thaddi-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/thaddi-mobile", "run", "serve" ]

[services.env]
PORT = "20717"
BASE_PATH = "/mobile/"
