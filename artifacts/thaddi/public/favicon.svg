<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer gold ring -->
  <circle cx="90" cy="90" r="89" fill="#B8871A"/>
  <!-- Mid gold -->
  <circle cx="90" cy="90" r="82" fill="#D4A520"/>
  <!-- Dark green body -->
  <circle cx="90" cy="90" r="74" fill="#0d1f12"/>
  <!-- Inner ring shine -->
  <circle cx="90" cy="90" r="74" stroke="#a07310" stroke-width="1.5" fill="none"/>

  <!-- 5-pointed star centred at (90,90), outer r=50, inner r=21 -->
  <polygon
    points="90,38 102.5,72 138,72 110,93 121,128 90,108 59,128 70,93 42,72 77.5,72"
    fill="#D4A520"
    stroke="#B8871A"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Letter T in the centre of the star -->
  <text x="90" y="107" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="38"
        fill="#0d1f12">T</text>
</svg>
