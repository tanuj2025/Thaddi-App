kind = "web"
previewPath = "/"
title = "THADDI"
version = "1.0.0"
id = "artifacts/thaddi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22681

[services.development]
run = "pnpm --filter @workspace/thaddi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thaddi", "run", "build" ]
publicDir = "artifacts/thaddi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22681"
BASE_PATH = "/"
